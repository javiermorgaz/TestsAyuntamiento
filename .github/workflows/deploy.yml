name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.4.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          case "$VITE_SQLITE_API_URL" in
            https://*) ;;
            *) echo "::error::Configura VITE_SQLITE_API_URL en los secretos del repositorio."; exit 1 ;;
          esac
          pnpm build
        env:
          VITE_DATA_PROVIDER: sqlite
          VITE_SQLITE_ACCESS_MODE: public
          VITE_SQLITE_API_URL: ${{ secrets.VITE_SQLITE_API_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
